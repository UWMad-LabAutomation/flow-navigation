# Nav2 parameters for the holonomic FLOW base.
# The map file itself is supplied to navigation_launch.py with the `map` argument.

amcl:
  ros__parameters:
    # Calibrated for the clean Gazebo wheel odometry. The old 0.2 values
    # let particles wander when only the forward camera saw the corridor.
    # Re-estimate these noise coefficients before using real base odometry.
    alpha1: 0.02
    alpha2: 0.005
    alpha3: 0.02
    alpha4: 0.005
    alpha5: 0.005
    base_frame_id: base_footprint
    global_frame_id: map
    odom_frame_id: odom
    robot_model_type: nav2_amcl::OmniMotionModel
    scan_topic: scan
    # Combine the valid camera beams as probabilities, ignoring missing returns.
    # Frequent updates constrain heading before drift changes the planned path.
    laser_model_type: likelihood_field_prob
    do_beamskip: false
    laser_max_range: 100.0
    laser_min_range: -1.0
    max_beams: 90
    min_particles: 500
    max_particles: 2000
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1
    sigma_hit: 0.1
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.05
    update_min_d: 0.05
    z_hit: 0.95
    z_rand: 0.05

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: [navigate_to_pose, navigate_through_poses]
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
    navigate_through_poses:
      plugin: nav2_bt_navigator::NavigateThroughPosesNavigator
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    controller_frequency: 20.0
    costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: [progress_checker]
    goal_checker_plugins: [general_goal_checker]
    controller_plugins: [FollowPath]
    use_realtime_priority: false
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.20
      movement_time_allowance: 10.0
    general_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
    FollowPath:
      # Default navigation follows the path using forward motion and yaw.
      # FLOW is still physically holonomic; ordinary path following does not strafe.
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.35
      lookahead_dist: 0.8
      use_velocity_scaled_lookahead_dist: false
      transform_tolerance: 0.1
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.35
      rotate_to_heading_angular_vel: 0.6
      max_angular_accel: 1.0
      allow_reversing: false
      stateful: true
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.8
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.10
      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 0.6
      cost_scaling_gain: 1.0
      # Match the local inflation layer below for distance-from-cost estimates.
      inflation_cost_scaling_factor: 3.0
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.5
      max_robot_pose_search_dist: 2.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      footprint: "[[0.3755, 0.271], [0.3755, -0.271], [-0.3755, -0.271], [-0.3755, 0.271]]"
      footprint_padding: 0.02
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          inf_is_valid: false
          data_type: LaserScan
          raytrace_max_range: 12.0
          raytrace_min_range: 0.12
          obstacle_max_range: 10.0
          obstacle_min_range: 0.12
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        inflation_radius: 0.70
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.05
      track_unknown_space: true
      footprint: "[[0.3755, 0.271], [0.3755, -0.271], [-0.3755, -0.271], [-0.3755, 0.271]]"
      footprint_padding: 0.02
      # Keep the static maze and camera-derived scan obstacles, then add a graded
      # clearance cost around them so the global planner prefers corridor
      # centers instead of treating every free cell as equally good.
      plugins: [static_layer, obstacle_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          inf_is_valid: false
          data_type: LaserScan
          raytrace_max_range: 12.0
          raytrace_min_range: 0.12
          obstacle_max_range: 10.0
          obstacle_min_range: 0.12
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        # Reach the center of a 2.5 m corridor; 0.90 m left a zero-cost
        # strip that allowed equally cheap paths to wander toward either wall.
        inflation_radius: 1.50
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    planner_plugins: [GridBased]
    costmap_update_timeout: 1.0
    GridBased:
      plugin: nav2_smac_planner::SmacPlanner2D
      tolerance: 0.25
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      terminal_checking_interval: 5000
      max_planning_time: 5.0
      cost_travel_multiplier: 4.0
      use_final_approach_orientation: false
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10

smoother_server:
  ros__parameters:
    smoother_plugins: [simple_smoother]
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: [spin, backup, drive_on_heading, assisted_teleop, wait]
    spin:
      plugin: nav2_behaviors::Spin
    backup:
      plugin: nav2_behaviors::BackUp
    drive_on_heading:
      plugin: nav2_behaviors::DriveOnHeading
    assisted_teleop:
      plugin: nav2_behaviors::AssistedTeleop
    wait:
      plugin: nav2_behaviors::Wait
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: true
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    stamp_smoothed_velocity_with_smoothing_time: false
    scale_velocities: false
    feedback: OPEN_LOOP
    # Enforce zero lateral velocity for the default navigation policy.
    # Slow reverse remains available to the BackUp recovery behavior.
    max_velocity: [0.35, 0.0, 0.8]
    min_velocity: [-0.10, 0.0, -0.8]
    max_accel: [0.6, 0.6, 1.0]
    max_decel: [-1.0, -0.6, -1.0]
    odom_topic: odom
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

collision_monitor:
  ros__parameters:
    base_frame_id: base_footprint
    odom_frame_id: odom
    cmd_vel_in_topic: cmd_vel_smoothed
    cmd_vel_out_topic: cmd_vel
    state_topic: collision_monitor_state
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: true
    stop_pub_timeout: 2.0
    polygons: [FootprintApproach]
    FootprintApproach:
      type: polygon
      action_type: approach
      footprint_topic: /local_costmap/published_footprint
      time_before_collision: 1.2
      simulation_time_step: 0.1
      min_points: 6
      visualize: false
      enabled: true
    observation_sources: [scan]
    scan:
      type: scan
      topic: scan
      min_height: 0.15
      max_height: 2.0
      enabled: true
