# Nav2 parameters for the holonomic FLOW base.
# The map file itself is supplied to navigation_launch.py with the `map` argument.

amcl:
  ros__parameters:
    # Low noise for the nearly exact Gazebo mecanum odometry. Wider noise
    # let unmapped obstacles pull the limited-FOV camera estimate off the map.
    # Re-estimate these noise coefficients before using real base odometry.
    alpha1: 0.002
    alpha2: 0.0005
    alpha3: 0.002
    alpha4: 0.0005
    alpha5: 0.0005
    base_frame_id: base_footprint
    global_frame_id: map
    odom_frame_id: odom
    robot_model_type: nav2_amcl::OmniMotionModel
    scan_topic: scan
    # Combine the valid camera beams as probabilities, ignoring missing returns.
    # Frequent updates constrain heading before drift changes the planned path.
    laser_model_type: likelihood_field_prob
    do_beamskip: true
    beam_skip_distance: 0.5
    beam_skip_threshold: 0.3
    beam_skip_error_threshold: 0.9
    laser_max_range: 100.0
    laser_min_range: -1.0
    max_beams: 90
    min_particles: 500
    max_particles: 2000
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1
    sigma_hit: 0.1
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.05
    update_min_d: 0.05
    z_hit: 0.95
    z_rand: 0.05

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: [navigate_to_pose, navigate_through_poses]
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
    navigate_through_poses:
      plugin: nav2_bt_navigator::NavigateThroughPosesNavigator
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    controller_frequency: 20.0
    costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: [progress_checker]
    goal_checker_plugins: [general_goal_checker]
    controller_plugins: [FollowPath]
    use_realtime_priority: false
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.20
      movement_time_allowance: 10.0
    general_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
    FollowPath:
      plugin: nav2_mppi_controller::MPPIController
      motion_model: Omni
      # 2.4 s horizon fits within the 4 m local costmap at 0.63 m/s.
      time_steps: 48
      model_dt: 0.05
      batch_size: 1000
      iteration_count: 1
      vx_std: 0.25
      vy_std: 0.12
      wz_std: 0.35
      vx_max: 0.63
      vx_min: -0.10
      vy_max: 0.63
      wz_max: 0.8
      ax_max: 0.6
      ax_min: -1.0
      ay_max: 0.6
      ay_min: -1.0
      az_max: 1.0
      prune_distance: 2.0
      transform_tolerance: 0.1
      temperature: 0.3
      gamma: 0.015
      visualize: false
      regenerate_noises: false
      reset_period: 1.0
      retry_attempt_limit: 1
      # Face travel along a clear path. Omni sampling still permits lateral
      # collision avoidance, but reverse is limited to slow maneuvering.
      critics: [ConstraintCritic, CostCritic, GoalCritic, GoalAngleCritic,
                PathAlignCritic, PathFollowCritic, PathAngleCritic,
                PreferForwardCritic, ForwardTravelCritic, TwirlingCritic]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 0.5
        trajectory_point_step: 2
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 2
        threshold_to_consider: 0.5
        offset_from_furthest: 3
        use_path_orientations: true
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 12.0
        offset_from_furthest: 12
        threshold_to_consider: 0.5
      TwirlingCritic:
        enabled: true
        cost_power: 1
        cost_weight: 0.5
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 10.0
        offset_from_furthest: 12
        threshold_to_consider: 0.5
        max_angle_to_furthest: 0.25
        mode: 0
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5
      ForwardTravelCritic:
        enabled: true
        cost_weight: 60.0
        avoidance_weight: 4.0
        forward_half_angle: 0.261799
        obstacle_lookahead: 1.5
        alignment_tolerance: 0.5
        robot_half_length: 0.3955
        robot_half_width: 0.321

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      footprint: "[[0.3755, 0.271], [0.3755, -0.271], [-0.3755, -0.271], [-0.3755, 0.271]]"
      footprint_padding: 0.02
      # Holonomic travel also needs mapped obstacles outside the camera FOV.
      plugins: [static_layer, obstacle_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          inf_is_valid: false
          data_type: LaserScan
          raytrace_max_range: 12.0
          raytrace_min_range: 0.12
          obstacle_max_range: 10.0
          obstacle_min_range: 0.12
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        inflation_radius: 0.70
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.05
      track_unknown_space: true
      footprint: "[[0.3755, 0.271], [0.3755, -0.271], [-0.3755, -0.271], [-0.3755, 0.271]]"
      footprint_padding: 0.02
      # Keep the static maze and camera-derived scan obstacles, then add a graded
      # clearance cost around them so the global planner prefers corridor
      # centers instead of treating every free cell as equally good.
      plugins: [static_layer, obstacle_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          inf_is_valid: false
          data_type: LaserScan
          raytrace_max_range: 12.0
          raytrace_min_range: 0.12
          obstacle_max_range: 10.0
          obstacle_min_range: 0.12
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        # Reach the center of a 2.5 m corridor; 0.90 m left a zero-cost
        # strip that allowed equally cheap paths to wander toward either wall.
        inflation_radius: 1.50
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    planner_plugins: [GridBased]
    costmap_update_timeout: 1.0
    GridBased:
      plugin: nav2_smac_planner::SmacPlannerHybrid
      tolerance: 0.25
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      terminal_checking_interval: 5000
      max_planning_time: 5.0
      # Forward curved global paths match the forward-facing camera.
      motion_model_for_search: DUBIN
      angle_quantization_bins: 72
      # A global-path curvature preference, not FLOW's physical turn limit.
      minimum_turning_radius: 0.4
      reverse_penalty: 1.2
      change_penalty: 0.0
      non_straight_penalty: 1.2
      cost_penalty: 2.0
      retrospective_penalty: 0.015
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 2.0
      lookup_table_size: 10.0
      cache_obstacle_heuristic: false
      smooth_path: true
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10

smoother_server:
  ros__parameters:
    smoother_plugins: [simple_smoother]
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: [backup, drive_on_heading, assisted_teleop, wait]
    backup:
      plugin: nav2_behaviors::BackUp
    drive_on_heading:
      plugin: nav2_behaviors::DriveOnHeading
    assisted_teleop:
      plugin: nav2_behaviors::AssistedTeleop
    wait:
      plugin: nav2_behaviors::Wait
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: true
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    stamp_smoothed_velocity_with_smoothing_time: false
    scale_velocities: false
    feedback: OPEN_LOOP
    # Axis limits allow full-speed strafing. The following limiter also caps
    # hypot(vx, vy), since independent axis limits permit faster diagonals.
    max_velocity: [0.63, 0.63, 0.8]
    min_velocity: [-0.10, -0.63, -0.8]
    max_accel: [0.6, 0.6, 1.0]
    max_decel: [-1.0, -0.6, -1.0]
    odom_topic: odom
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

planar_velocity_limiter:
  ros__parameters:
    max_speed: 0.63
    max_yaw_rate: 0.8
    command_timeout: 0.5

collision_monitor:
  ros__parameters:
    base_frame_id: base_footprint
    odom_frame_id: odom
    cmd_vel_in_topic: cmd_vel_limited
    cmd_vel_out_topic: cmd_vel
    state_topic: collision_monitor_state
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: true
    stop_pub_timeout: 2.0
    polygons: [FootprintApproach]
    FootprintApproach:
      type: polygon
      action_type: approach
      footprint_topic: /local_costmap/published_footprint
      time_before_collision: 1.2
      simulation_time_step: 0.1
      min_points: 6
      visualize: false
      enabled: true
    observation_sources: [scan]
    scan:
      type: scan
      topic: scan
      min_height: 0.15
      max_height: 2.0
      enabled: true
